name: JiPin
options:
  bundleIdPrefix: com.jipin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "4.0.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: MFLYL78RAN
packages:
  JiPinCore:
    path: Packages/JiPinCore
targets:
  JiPin:
    type: application
    platform: iOS
    sources:
      - path: Apps/JiPin
        excludes:
          - "**/.DS_Store"
      - path: Apps/JiPinAction/QuickCollageView.swift
    resources:
      - path: Apps/JiPin/Resources
    info:
      path: Apps/JiPin/Info.plist
      properties:
        CFBundleDisplayName: 极拼
        CFBundleShortVersionString: "4.0.0"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: 极拼需要将拼图保存到你的相册。只有在你选择保存时才会申请此权限。
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Apps/JiPin/JiPin.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jipin.JiPin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jipin.JiPin
        PRODUCT_NAME: JiPin
        INFOPLIST_KEY_CFBundleDisplayName: 极拼
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: JiPinCore
      - target: JiPinAction
        embed: true
        codeSign: true
  JiPinAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/JiPinAction
    resources:
      - path: Apps/JiPinAction/PrivacyInfo.xcprivacy
    info:
      path: Apps/JiPinAction/Info.plist
      properties:
        CFBundleDisplayName: 极拼
        CFBundleShortVersionString: "4.0.0"
        CFBundleVersion: "4"
        NSPhotoLibraryAddUsageDescription: 极拼需要将拼图保存到你的相册。只有在你选择保存时才会申请此权限。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: ActionViewController
          NSExtensionActionWantsFullScreenPresentation: true
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationDictionaryVersion: 2
              NSExtensionActivationSupportsImageWithMaxCount: 9
              NSExtensionActivationSupportsFileWithMaxCount: 9
    entitlements:
      path: Apps/JiPinAction/JiPinAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jipin.JiPin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jipin.JiPin.Action
        PRODUCT_NAME: JiPinAction
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: JiPinCore
  JiPinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Packages/JiPinCore/Tests/JiPinCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jipin.JiPin.Tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - target: JiPin
      - package: JiPinCore
  JiPinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/JiPinUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jipin.JiPin.UITests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_TARGET_NAME: JiPin
    dependencies:
      - target: JiPin
schemes:
  JiPin:
    build:
      targets:
        JiPin: all
        JiPinAction: all
        JiPinTests: [test]
        JiPinUITests: [test]
    test:
      targets:
        - JiPinTests
        - JiPinUITests
